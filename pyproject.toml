[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "field-service-dispatch-ai-agent"
version = "0.1.0"
description = "Human-approved field service dispatch planning API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.27,<1.0", "pydantic>=2.6,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
